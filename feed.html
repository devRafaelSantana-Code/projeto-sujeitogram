<!doctype html>
<html lang="pt">
   <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <link rel="stylesheet" href="style.css" />
      <title>Feed - Sujeitogram</title>
   </head>
   <body>
      <header>
         <div>
            <a href="index.html">
               <img src="./assets/logo.png" alt="Logo do Sujeitogram" />
            </a>
            <h1>Feed</h1>
         </div>
      </header>

      <main class="feed-container">
         <article class="post">
            <div class="perfil">
               <img
                  src="./assets/fotoPerfil/fotoPerfil1.png"
                  alt="Foto de Perfil de Dev. Rafael Santana"
               />
               <h2>Dev. Rafael Santana</h2>
            </div>
            <div class="postagem">
               <img
                  src="./assets/postFeed/foto1.png"
                  alt="Postagem de Dev. Rafael Santana"
               />
            </div>
            <div class="links">
               <button type="button">Curtir</button>
               <button type="button">Repostar</button>
            </div>
         </article>

         <article class="post">
            <div class="perfil">
               <img
                  src="./assets/fotoPerfil/fotoPerfil2.png"
                  alt="Foto de Perfil de Sujeito Programador"
               />
               <h2>Sujeito Programador</h2>
            </div>
            <div class="postagem">
               <img
                  src="./assets/postFeed/foto2.png"
                  alt="Postagem de Sujeito Programador"
               />
            </div>
            <div class="links">
               <button type="button">Curtir</button>
               <button type="button">Repostar</button>
            </div>
         </article>

         <article class="post">
            <div class="perfil">
               <img
                  src="./assets/fotoPerfil/fotoPerfil3.png"
                  alt="Foto de Perfil de Luiz Felipe"
               />
               <h2>Luiz Felipe</h2>
            </div>
            <div class="postagem">
               <img
                  src="./assets/postFeed/foto3.png"
                  alt="Postagem de Luiz Felipe"
               />
            </div>
            <div class="links">
               <button type="button">Curtir</button>
               <button type="button">Repostar</button>
            </div>
         </article>
      </main>

      <script src="script.js"></script>
   </body>
</html>
