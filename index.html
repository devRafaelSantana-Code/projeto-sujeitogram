<!doctype html>
<html lang="pt">
   <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <link rel="stylesheet" href="style.css" />
      <title>Sujeitogram - Sua rede social</title>
   </head>
   <body>
      <div id="wrapper">
         <div class="container">
            <div class="column left"></div>

            <div class="column right">
               <div class="login-panel">
                  <img
                     class="logo-img"
                     src="./assets/logo.png"
                     alt="Logo do Sujeitogram"
                  />

                  <form action="feed.html">
                     <input
                        type="text"
                        placeholder="Telefone, nome de usuário ou email"
                        name="username"
                        required
                     />
                     <input
                        type="password"
                        placeholder="Senha"
                        name="password"
                        required
                     />
                     <input type="submit" value="Entrar" />
                  </form>
               </div>

               <div class="info-box">
                  <p>
                     Não possui uma conta? <a href="signup.html">Cadastre-se</a>
                  </p>
               </div>

               <div class="get-app-panel">
                  <p>Obtenha o aplicativo</p>
                  <div class="app-buttons">
                     <a href="#"
                        ><img
                           src="./assets/appstore.png"
                           alt="Baixe na Appstore"
                     /></a>
                     <a href="#"
                        ><img
                           src="./assets/googleplay.png"
                           alt="Baixe no Googleplay"
                     /></a>
                  </div>
               </div>
            </div>
         </div>
      </div>

      <footer>
         <div class="footer-inner">
            <a href="#">About us</a>
            <a href="#">Support</a>
            <a href="#">Blog</a>
            <a href="#">Press</a>
            <a href="#">API</a>
            <a href="feed.html">Feed</a>
            <a href="#">Privacy</a>
            <a href="#">Terms</a>
            <a href="#">Directory</a>
            <a href="#">Profiles</a>
            <a href="#">Hashtags</a>
            <a href="#">Language</a>
            <span class="text-small">© 2026 Instagram</span>
         </div>
      </footer>
   </body>
</html>
