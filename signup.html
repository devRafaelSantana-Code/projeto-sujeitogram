<!doctype html>
<html lang="pt">
   <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <link rel="stylesheet" href="style.css" />
      <title>Faça seu cadastro - Sujeitogram</title>
   </head>
   <body>
      <div id="wrapper">
         <div class="container-signup">
            <div class="login-panel">
               <img
                  class="logo-img"
                  src="./assets/logo.png"
                  alt="Logo do Sujeitogram"
               />

               <div class="message">
                  <span
                     >Cadastre-se para ver fotos e vídeos dos seus amigos</span
                  >
               </div>

               <button type="button" class="facebook-button">
                  Entrar com Facebook
               </button>

               <div class="divisor-container">
                  <div class="line"></div>
                  <div class="divisor-tag">ou</div>
                  <div class="line"></div>
               </div>

               <form action="feed.html">
                  <input
                     type="text"
                     placeholder="Número de celular ou email"
                     name="email"
                     required
                  />
                  <input
                     type="text"
                     placeholder="Nome completo"
                     name="fullname"
                     required
                  />
                  <input
                     type="text"
                     placeholder="Nome de usuário"
                     name="username"
                     required
                  />
                  <input
                     type="password"
                     placeholder="Senha"
                     name="password"
                     required
                  />
                  <input type="submit" value="Cadastrar" />
               </form>
            </div>

            <div class="info-box">
               <p>Tem uma conta? <a href="index.html">Conecte-se</a></p>
            </div>

            <div class="get-app-panel">
               <p>Obtenha o aplicativo</p>
               <div class="app-buttons">
                  <a href="#"
                     ><img src="./assets/appstore.png" alt="Baixe na Appstore"
                  /></a>
                  <a href="#"
                     ><img
                        src="./assets/googleplay.png"
                        alt="Baixe no Googleplay"
                  /></a>
               </div>
            </div>
         </div>
      </div>

      <footer>
         <div class="footer-inner">
            <a href="#">About us</a>
            <a href="#">Support</a>
            <a href="#">Blog</a>
            <a href="#">Press</a>
            <a href="#">API</a>
            <a href="feed.html">Feed</a>
            <a href="#">Privacy</a>
            <a href="#">Terms</a>
            <a href="#">Directory</a>
            <a href="#">Profiles</a>
            <a href="#">Hashtags</a>
            <a href="#">Language</a>
            <span class="text-small">© 2026 Instagram</span>
         </div>
      </footer>
   </body>
</html>
